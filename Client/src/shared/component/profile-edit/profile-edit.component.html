<div (click)="handleNavigateBack()" class="arrow">
  <i class="fa-solid fa-arrow-left"></i>
</div>
<div class="container mt-5">
  <form (ngSubmit)="handleUpdateUserData()"
        [formGroup]="profileForm"
        class=" prof-form">
    <div class="left">
      <img alt src="../../../assets/birdnest.jpg" />
    </div>
    <div class="right d-flex flex-column gap-2">
      <div class="mb-3">
        <label class="form-label" for="contactNumber">Contact Number</label>
        <input class="form-control"
               formControlName="contactNumber"
               id="contactNumber"
               type="text" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control"
               formControlName="email"
               id="email"
               type="email" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="firstName">First Name</label>
        <input class="form-control"
               formControlName="firstName"
               id="firstName"
               type="text" />
      </div>

      <div class="mb-3">
        <label class="form-label" for="lastName">Last Name</label>
        <input class="form-control"
               formControlName="lastName"
               id="lastName"
               type="text" />
      </div>

      <div class="mb-3">
        <mat-radio-group formControlName="role">
          <mat-radio-button value="tenant">Tenant</mat-radio-button>
          <mat-radio-button value="landlord">Landlord</mat-radio-button>
        </mat-radio-group>
      </div>
    </div>

    <button type="submit">Update Profile</button>
  </form>
</div>

<app-toast (visibleChange)="showToast = $event"
           [headerMessage]="headerMessage"
           [speed]="100"
           [toastMessage]="toastMessage"
           [visible]="showToast">
</app-toast>
